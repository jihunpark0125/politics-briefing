name: 정치 모닝 브리핑

on:
  schedule:
    # UTC 23:05 = 한국시간 오전 08:05
    # 경제 브리핑과 OpenAI 호출이 겹치지 않도록 시간을 분리합니다.
    - cron: "5 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: politics-briefing-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v6

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 오늘의 정치 브리핑 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ABOUT_URL: ${{ vars.ABOUT_URL }}
          ENABLE_WEB_DISCOVERY: "1"
        run: python main.py

      - name: 생성된 페이지와 아카이브를 저장소에 기록
        run: |
          git config user.name "politics-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "정치 브리핑 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 정적 페이지 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
