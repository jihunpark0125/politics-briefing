name: 정치 모닝 브리핑

on:
  # 자동 스케줄 중단 (2026-08-30, OpenAI API 토큰 비용 절감).
  # 필요 시 아래 schedule 블록의 주석을 해제해 재개하세요.
  # schedule:
  #   # UTC 23:05 = 한국시간 오전 08:05
  #   - cron: "5 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: politics-briefing-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 오늘의 정치 브리핑 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ABOUT_URL: ${{ vars.ABOUT_URL }}
          ENABLE_WEB_DISCOVERY: "1"
        run: python main.py

      - name: 생성된 페이지와 아카이브를 저장소에 기록
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "politics-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GENERATED_DIR="$(mktemp -d)"
          cp -a docs "$GENERATED_DIR/docs"

          for attempt in 1 2 3; do
            echo "브리핑 업로드 시도 ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main

            rm -rf docs
            cp -a "$GENERATED_DIR/docs" docs

            git add docs/

            if git diff --cached --quiet; then
              echo "변경 사항 없음 - 커밋 생략"
              exit 0
            fi

            git commit -m "정치 브리핑 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"

            if git push origin HEAD:main; then
              echo "정치 브리핑 커밋 완료"
              exit 0
            fi

            echo "원격 main 변경 감지 - 최신 상태를 가져와 다시 시도합니다."
            sleep $((attempt * 5))
          done

          echo "3회 재시도 후에도 push에 실패했습니다."
          exit 1

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: 정적 페이지 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
